aid: gradle
name: Gradle
description: >-
  Gradle Inc. (Gradle Technologies) is the company behind the open-source Gradle
  Build Tool, downloaded more than 25 million times a month across the Java, JVM,
  Android, Kotlin, C/C++, and native ecosystems, and Develocity (formerly Gradle
  Enterprise), its commercial Developer Productivity Engineering platform. Develocity
  adds Build Scan, Build Cache, Predictive Test Selection, and Test Distribution to
  accelerate and stabilize builds and tests. The Develocity API is a JSON REST API,
  described with OpenAPI, that provides programmatic access to build data, failures,
  tests, projects, project groups, Build Cache node configuration, Test Distribution
  agent pools, and short-lived access tokens on a self-hosted Develocity instance.
  Founded in 2009 and headquartered in San Francisco with offices in Berlin and
  Melbourne, Gradle raised a $27M Series C led by Triangle Peak Partners.
